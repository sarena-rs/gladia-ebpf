[workspace]
members = [
    "gladia",
    "gladia-macros",

    # Shared (userspace & eBPF)
    "gladia-shared",

    # eBPF framework
    "gladia-ebpf",

    # Build tooling
    "xtask",
]

# The example eBPF programs form their own workspace (see examples/Cargo.toml).
exclude = ["examples"]

default-members = [
    "gladia",
    "gladia-macros",

    # Shared (userspace & eBPF)
    "gladia-shared",

    # gladia-ebpf is not included because it only builds for the eBPF target
    # the xtask is also not included because its a build crate
]

resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sarena-rs/ebpf-test-framework"
keywords = ["ebpf", "xdp", "tcx", "testing", "aya"]
version = "0.1.0"

[workspace.dependencies]
# Internal crates. Released in lockstep, so pinned to the exact version: the
# wire format between gladia and gladia-ebpf must match.
gladia-macros = { path = "gladia-macros", version = "=0.1.0" }
gladia-shared = { path = "gladia-shared", version = "=0.1.0", default-features = false }

anyhow = { version = "1" }
async-trait = "0.1.89"
aya = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-build = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-ebpf = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-log = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-log-ebpf = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
bitflags = "2"
bytes = "1.11"
cargo_metadata = { version = "0.23", default-features = false }
clap = { version = "4", features = ["std"] }
clap_complete = "4"
config = "0.15"
env_logger = { version = "0.11", default-features = false }
futures = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false }
ipnet = { version ="2", default-features = false }
jsonpath_lib = "0.3"
log = { version = "0.4", default-features = false }
network-types = { version = "0.2", default-features = false }
nix = { version = "0.31", features = ["poll"] }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false }
object = "0.37"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
rand = { version = "0.10", default-features = false }
regex = { version = "1.12" }
schemars = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
syn = { version = "3", features = ["full", "visit"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1.40" }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
which = { version = "8" }
wiremock = "0.6"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"
pedantic = "warn"

cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
default_trait_access = { level = "allow", priority = 1 }
inline_always = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
len_without_is_empty = { level = "allow", priority = 1 }
match_same_arms = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
transmute_ptr_to_ptr = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }

cargo_common_metadata = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
