[package]
name = "ebpf-programs"

edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
aya-ebpf = { workspace = true, default-features = false }
aya-log-ebpf = { workspace = true }
bitflags = { workspace = true, default-features = false }
network-types = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }

[build-dependencies]
which = { workspace = true }

# eBPF programs cannot have tests: the eBPF target has no `test` crate, and
# test builds force `panic = "unwind"`, which breaks `build-std`.
[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "ebpf-programs"
path = "src/main.rs"
test = false
bench = false
